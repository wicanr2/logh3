<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字型選擇預覽</title><style>body{background:#101d30;color:#f9e8bb;font-family:serif;margin:32px}main{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:24px}section{border:1px solid #a28a50;padding:16px;background:#162b47}img{width:100%;height:auto}p{line-height:1.7;color:#d9e1ec}@media(max-width:1000px){main{grid-template-columns:1fr}}</style><h1>字型選擇預覽</h1><p>預計在設定內增加三款字型，保留原版字距、按鈕位置與面板配置。以下是字型試樣；宋體與黑體尚未接入正式遊戲。</p><main><section><h2>原版強化</h2><img src="font-v130-classic.png" alt="原版強化"><p>保留目前字形與復古筆畫。</p></section><section><h2>思源宋體</h2><img src="font-v130-serif.png" alt="思源宋體"><p>有襯線，適合歷史敘事與人物資料。</p></section><section><h2>思源黑體</h2><img src="font-v130-sans.png" alt="思源黑體"><p>筆畫簡潔，數字與密集資訊較易讀。</p></section></main><p>建議保留原版強化為預設，讓玩家自行選擇宋體或黑體。字型選擇獨立於原圖／HD與AI模式。</p></html>
