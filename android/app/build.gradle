plugins {
    id 'com.android.application'
}

// 規格161。Docker 只把明確的輸出目錄設成可寫，原始碼唯讀。
if (project.hasProperty('logh3BuildDir')) {
    layout.buildDirectory.set(file(project.property('logh3BuildDir')))
}

android {
    namespace 'tw.logh3.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'tw.logh3.app'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName (project.findProperty('logh3Version') ?: 'dev')
        // 只有 64 位元：規則碼假設 int 為 64 位元（tools/android.sh 註解）。
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file(project.findProperty('logh3DebugKeystore') ?: '../../workplace/android-state/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = false }
    }

    // 完整版（只留本機）才傳 -Plogh3FullDir=<目錄>，內含 full/original 與 full/data。
    // release 版不嵌入任何原版檔。
    if (project.hasProperty('logh3FullDir')) {
        sourceSets.main.assets.srcDir(project.property('logh3FullDir'))
    }
    // 原版檔與 PNG 已經壓縮或很小，不再壓縮，首次解開較快。
    androidResources { noCompress += [''] }
}

dependencies {
    implementation files(project.property('logh3Aar'))
}
