plugins {
    id 'com.android.application'
}

// 規格161。Docker 只把明確的輸出目錄設成可寫，原始碼唯讀。
if (project.hasProperty('logh3BuildDir')) {
    layout.buildDirectory.set(file(project.property('logh3BuildDir')))
}

android {
    namespace 'tw.logh3.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'tw.logh3.app'
        minSdk 21
        targetSdk 35
        versionCode ((project.findProperty('logh3VersionCode') ?: '1') as int)
        versionName (project.findProperty('logh3Version') ?: 'dev')
        // 只有 64 位元：規則碼假設 int 為 64 位元（tools/android.sh 註解）。
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file(project.findProperty('logh3DebugKeystore') ?: '../../workplace/android-state/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // 發行金鑰只在本機（workplace/android-state，不進 Git）；密碼放在旁邊的檔案。
        // 之後每一版都用同一把簽，才能覆蓋安裝、保留 App 內存檔。
        if (project.hasProperty('logh3ReleaseKeystore')) {
            release {
                storeFile file(project.property('logh3ReleaseKeystore'))
                storePassword file(project.property('logh3ReleasePassFile')).text.trim()
                keyAlias 'logh3'
                keyPassword file(project.property('logh3ReleasePassFile')).text.trim()
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (project.hasProperty('logh3ReleaseKeystore')) {
                signingConfig signingConfigs.release
            }
        }
    }

    // release 建置預設跑 lintVital，要另外抓 lint 套件；離線建置關掉（只有一支 Activity，沒有規則可檢）。
    lint { checkReleaseBuilds false }

    packaging {
        jniLibs { useLegacyPackaging = false }
    }

    // 完整版（只留本機）才傳 -Plogh3FullDir=<目錄>，內含 full/original 與 full/data。
    // release 版不嵌入任何原版檔。
    if (project.hasProperty('logh3FullDir')) {
        sourceSets.main.assets.srcDir(project.property('logh3FullDir'))
    }
    // 原版檔與 PNG 已經壓縮或很小，不再壓縮，首次解開較快。
    androidResources { noCompress += [''] }
}

dependencies {
    implementation files(project.property('logh3Aar'))
}
